<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart Hospital Management System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap-icons/bootstrap-icons.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
    <style>
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            padding: 1.5rem;
        }
        .login-card {
            width: 100%;
            max-width: 440px;
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 1rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            color: #f8fafc;
            overflow: hidden;
        }
        .login-header {
            padding: 2.25rem 2rem 1.5rem;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .login-body {
            padding: 2rem;
        }
        .hospital-icon-wrapper {
            width: 64px;
            height: 64px;
            margin: 0 auto 1rem;
            border-radius: 1rem;
            background: linear-gradient(135deg, #3b82f6 0%, #06b6d4 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: #ffffff;
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.4);
        }
        .form-floating label {
            color: #94a3b8;
        }
        .login-input {
            background: rgba(15, 23, 42, 0.6) !important;
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            color: #f8fafc !important;
        }
        .login-input:focus {
            background: rgba(15, 23, 42, 0.85) !important;
            border-color: #38bdf8 !important;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25) !important;
        }
        .btn-login {
            background: linear-gradient(135deg, #2563eb 0%, #0284c7 100%);
            border: none;
            color: white;
            font-weight: 600;
            padding: 0.75rem;
            border-radius: 0.5rem;
            transition: all 0.2s ease;
        }
        .btn-login:hover:not(:disabled) {
            background: linear-gradient(135deg, #1d4ed8 0%, #0369a1 100%);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
            transform: translateY(-1px);
        }
        .input-group-text {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #94a3b8;
        }
        .toggle-password {
            cursor: pointer;
        }
    </style>
</head>
<body class="login-page">
    <div class="login-card">
        <div class="login-header">
            <div class="hospital-icon-wrapper">
                <i class="bi bi-hospital"></i>
            </div>
            <h4 class="mb-1 text-white fw-bold">Smart Hospital</h4>
            <p class="text-secondary small mb-0">Management System &bull; Secure Login</p>
        </div>

        <div class="login-body">
            <div id="loginAlert" class="alert alert-danger d-none py-2 px-3 small" role="alert"></div>

            <form id="loginForm" autocomplete="on">
                <input type="hidden" id="nextParam" value="{{ next }}">

                <div class="mb-3">
                    <label for="usernameInput" class="form-label small text-secondary">Username</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control login-input" id="usernameInput" name="username"
                               placeholder="e.g. admin" required autofocus autocomplete="username">
                    </div>
                </div>

                <div class="mb-4">
                    <label for="passwordInput" class="form-label small text-secondary">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
                        <input type="password" class="form-control login-input" id="passwordInput" name="password"
                               placeholder="Enter your password" required autocomplete="current-password">
                        <button class="input-group-text toggle-password" type="button" id="togglePassword" aria-label="Toggle password visibility">
                            <i class="bi bi-eye" id="togglePasswordIcon"></i>
                        </button>
                    </div>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-login" id="loginBtn">
                        <span id="loginBtnText"><i class="bi bi-box-arrow-in-right me-1"></i> Sign In</span>
                        <span id="loginBtnSpinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                    </button>
                </div>
            </form>

            <div class="mt-4 pt-3 border-top border-secondary border-opacity-25 text-center text-secondary small">
                <span>BCSE302L Database Systems &bull; Review III</span>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
